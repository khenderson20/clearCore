name: Update release metadata

# Triggers when a GitHub Release is published (not a draft), and brings every
# version-bearing file in the repo into line with the tag:
#
#   CHANGELOG.md  [Unreleased] -> the released version, plus a fresh [Unreleased]
#   CITATION.cff  version + date-released
#   README.md     the BibTeX block's version field
#   wiki/Home.md  the version printed in the stats line
#
# The result is opened as a PR into develop (the ruleset blocks direct pushes).
#
# Before this existed the metadata drifted silently: at v0.3.5 the CITATION.cff
# still said 0.3.4 and the README BibTeX said 0.1.0 (#211).

on:
  release:
    types: [published]

permissions: read-all

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          # persist-credentials stays true (default): the "Open a pull request"
          # step below does `git push` using the credential helper this checkout
          # sets up. Token is the job-scoped GITHUB_TOKEN (contents: write), not
          # a long-lived secret.
          # zizmor: ignore[artipacked]
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Promote [Unreleased] to versioned entry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: |
          python3 - <<'EOF'
          import os, re

          tag_raw = os.environ["RELEASE_TAG"]
          tag     = tag_raw[1:] if tag_raw.startswith("v") else tag_raw  # v0.1.0 -> 0.1.0
          date    = os.environ["RELEASE_DATE"][:10]                     # YYYY-MM-DD

          with open("CHANGELOG.md") as f:
              content = f.read()

          # Rename the current [Unreleased] heading to the released version and add a
          # fresh, empty [Unreleased] above it. The existing Unreleased content stays
          # in place and becomes the body of the released entry.
          new_section = (
              "## [Unreleased]\n\n"
              "---\n\n"
              f"## [{tag}] - {date}"
          )
          updated, n = re.subn(r"## \[Unreleased\]", new_section, content, count=1)
          if n == 0:
              raise SystemExit("error: no '## [Unreleased]' section found in CHANGELOG.md")

          with open("CHANGELOG.md", "w") as f:
              f.write(updated)
          print(f"Promoted [Unreleased] -> [{tag}] - {date}")
          EOF

      - name: Align CITATION.cff and README BibTeX with the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: |
          python3 - <<'EOF'
          import os, re

          tag_raw = os.environ["RELEASE_TAG"]
          tag     = tag_raw[1:] if tag_raw.startswith("v") else tag_raw
          date    = os.environ["RELEASE_DATE"][:10]

          def patch(path, edits):
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              for pattern, repl, what in edits:
                  text, n = re.subn(pattern, repl, text, count=1)
                  if n == 0:
                      # Fail loudly. A silently-skipped substitution is exactly how the
                      # drift this step exists to prevent would creep back in.
                      raise SystemExit(f"error: {path}: found no {what} to update")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"{path}: aligned to {tag}")

          # `^version:` is anchored so it cannot also match `cff-version:` on line 1.
          # `doi:` is deliberately NOT touched: it is Zenodo's *concept* DOI, which
          # always resolves to the latest version and is version-independent by
          # design. Per-version DOIs exist but are not what this file cites.
          patch("CITATION.cff", [
              (r"(?m)^version:.*$",       f"version: {tag}",          "`version:` line"),
              (r"(?m)^date-released:.*$", f"date-released: '{date}'", "`date-released:` line"),
          ])

          patch("README.md", [
              (r"(\n\s*version\s*=\s*\{)[^}]*(\})", rf"\g<1>{tag}\g<2>",
               "BibTeX `version =` field"),
          ])

          # The wiki landing page prints the version in a stats line. Anchored on
          # "MIT license · v" so it cannot match the dependency versions on the
          # following line ("FTXUI v7.0.0 · GSL · spdlog …").
          patch("wiki/Home.md", [
              (r"(MIT license · v)\d+\.\d+\.\d+", rf"\g<1>{tag}",
               "`MIT license · v<version>` stats line"),
          ])
          EOF

      - name: Open a pull request with the release-metadata updates
        # The develop branch ruleset forbids direct pushes ("changes must be made
        # through a pull request"), so open a PR instead of pushing to develop.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files="CHANGELOG.md CITATION.cff README.md wiki/Home.md"
          if git diff --quiet -- $files; then
            echo "No release-metadata changes to commit"; exit 0
          fi
          branch="chore/release-metadata-${RELEASE_TAG}"
          git switch -c "$branch"
          git add $files
          git commit -m "chore: align release metadata with ${RELEASE_TAG}"
          git push --force-with-lease origin "$branch"
          # skip-changelog: this promotion PR should not appear in the next release's notes.
          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore: align release metadata for ${RELEASE_TAG}" \
            --body "Automated release-metadata update for ${RELEASE_TAG}, opened by \`update-changelog.yml\` (direct pushes to \`develop\` are blocked by the branch ruleset). Promotes the CHANGELOG's [Unreleased] section and aligns \`CITATION.cff\` and the README BibTeX with the tag. The Zenodo concept DOI is intentionally left unchanged." \
            --label skip-changelog \
            || echo "PR already exists for $branch"
