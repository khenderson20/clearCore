name: Cross-platform build

# Builds and tests clearCore on Windows and macOS. Nothing is tested on Intel
# macOS any more — the release build ships an Intel slice via a universal
# binary, but every macOS job runs on Apple Silicon (see the core-only matrix).
#
# Two jobs:
#   core-only : fast pre-merge safety net. core-only preset (no Qt, no LLVM,
#               configures in about a minute), build + test on every PR and
#               push to main/develop. Catches MSVC/AppleClang divergences
#               (narrowing conversions, two-phase lookup, /W4 vs -Wextra)
#               on a PR instead of after a release is already published.
#   build     : the full signed-installer matrix — Qt-bundled NSIS/DragNDrop
#               packaging plus Azure Trusted Signing. Gated to
#               release: published and workflow_dispatch only; it's too slow
#               and needs signing secrets to run on every PR.
#
# Nyxstone (LLVM) and the golden tests (JRE) are disabled in both jobs — they
# are Linux-oriented dev/test tooling, not user-facing, and painful to
# provision off-Linux.
on:
  workflow_dispatch:
  release:
    types: [ published ]
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reduced pre-merge matrix: same OSes as the release build, but core-only
  # (no Qt, no LLVM) so it's fast enough to run on every PR and doesn't need
  # any signing secrets or environment approval.
  core-only:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: core-only-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          # Apple Silicon only. The Intel leg ran on macos-13, which GitHub
          # retired on 2025-12-08; no runner ever claims that label again, so
          # the job sat queued forever (timeout-minutes bounds execution, not
          # queue time, so nothing self-cancelled). Deliberately not swapped
          # for macos-15-intel: the only coverage an Intel macOS leg adds over
          # macos-14 plus ci.yml's Linux x86_64 legs is AppleClang + libc++ on
          # x86_64, and a bit-exact integer emulator exercises none of what
          # differs there. Dropping it also restores this job's stated
          # invariant — same OSes as the release build, which dropped its own
          # Intel runner for the same reason. (#169)
          - { name: macos-arm64, os: macos-14 }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Suppress Windows Error Reporting dialogs so a crashing test subprocess
      # exits immediately instead of blocking on a modal "stopped working"
      # prompt until the job hits its timeout.
      - name: Suppress WER crash dialogs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Force -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" `
            -Name DontShowUI -Value 1 -PropertyType DWord | Out-Null

      # CLEARCORE_WERROR is set on these pre-merge legs only: they are what
      # keeps MSVC /W4 and AppleClang diagnostics from accumulating unseen. The
      # release `build` job below deliberately leaves it off — a cosmetic new
      # diagnostic from a toolchain bump must not block cutting a release.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset core-only -DGOLDEN_TESTS=OFF -DCLEARCORE_WERROR=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake --preset core-only -DGOLDEN_TESTS=OFF
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DCLEARCORE_WERROR=ON

      - name: Build
        run: cmake --build --preset core-only

      - name: Test
        run: ctest --preset core-only

  build:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write  # attach installers to the release
      id-token: write  # OIDC federated login for Azure Trusted Signing
    # Scopes the OIDC token to a stable subject
    # (repo:khenderson20/clearCore:environment:release-signing) so a single Entra
    # federated credential covers every release regardless of tag name. Also the
    # place to add a manual approval gate on signed releases later.
    environment: release-signing

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          # One universal (arm64 + x86_64) macOS build on Apple Silicon. Qt's
          # official macOS binaries are universal (since 6.2), so a single Qt
          # install covers both slices — no Intel runner needed, which is just
          # as well: macos-13 is retired and macos-15-intel goes away in 2027.
          - { name: macos-universal, os: macos-14 }
    env:
      # macOS minimum: std::format's to_chars backend is only available in
      # libc++ from macOS 13.3 onward. CMake reads this to seed the deployment
      # target; it is ignored on Windows.
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the Qt Advanced Docking System's CMake runs
          # `git describe --tags` in this repo to stamp its Windows version
          # resource. A shallow, tagless checkout yields an empty version and a
          # malformed FILEVERSION that the resource compiler rejects (RC2127).
          fetch-depth: 0
          persist-credentials: false

      - name: Install Qt 6
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.8.*'
          cache: true
          modules: 'qtshadertools'

      # Puts cl.exe / the MSVC toolchain on PATH so the Ninja-based preset works
      # on Windows without relying on the Visual Studio generator's discovery.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Ensure NSIS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Downloaded directly and verified against a pinned SHA-256 rather than
          # via choco: the choco feed can return exit 0 on a 503 (leaving makensis
          # absent) and cannot pin by hash, which Scorecard's Pinned-Dependencies
          # check requires. To bump: fetch the new nsis-<ver>-setup.exe from
          # https://sourceforge.net/projects/nsis/files/NSIS%203/ and update both
          # values below (`sha256sum nsis-<ver>-setup.exe`).
          #
          # The silent flag MUST be written `//S`, not `/S`. Under Git Bash, MSYS
          # rewrites a lone `/S` into a Windows path (C:/Program Files/Git/S), so
          # the installer never sees the flag, opens its GUI and blocks forever.
          # On a workflow_dispatch run it consumed the full 60-minute job timeout
          # on attempt 1 and was reaped as an orphan process, so Configure/Build/
          # Sign/Package never ran. `//S` collapses to a literal `/S` with no path
          # conversion. The `timeout` is a backstop: any future hang costs two
          # minutes and still leaves retries, instead of the entire job.
          NSIS_VERSION=3.12
          NSIS_SHA256=3bc2b06253a7e4957111be152ac6a536e0c7478a706e19da814038db5d706495
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          for attempt in 1 2 3 4 5; do
            [ -f "$makensis" ] && { echo "NSIS present"; exit 0; }
            echo "Installing NSIS (attempt $attempt)…"
            if curl -fsSL "https://downloads.sourceforge.net/project/nsis/NSIS%203/${NSIS_VERSION}/nsis-${NSIS_VERSION}-setup.exe" -o nsis-setup.exe                && echo "${NSIS_SHA256}  nsis-setup.exe" | sha256sum -c -; then
              timeout 120 ./nsis-setup.exe //S || echo "installer failed or timed out"
            fi
            [ -f "$makensis" ] && { echo "NSIS installed"; exit 0; }
            sleep 20
          done
          echo "::error::NSIS could not be installed"; exit 1

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake --preset release
          -DBUILD_NYXSTONE=OFF -DGOLDEN_TESTS=OFF -DCLEARCORE_BUNDLE_QT=ON

      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: >
          cmake --preset release
          -DBUILD_NYXSTONE=OFF -DGOLDEN_TESTS=OFF -DCLEARCORE_BUNDLE_QT=ON
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build --preset release

      - name: Verify universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bin=$(find build/release -path '*clearCore-gui.app/Contents/MacOS/clearCore-gui' | head -1)
          echo "binary: $bin"
          file "$bin"
          archs=$(lipo -archs "$bin")
          echo "architectures: $archs"
          echo "$archs" | grep -qw arm64  || { echo "::error::missing arm64 slice";  exit 1; }
          echo "$archs" | grep -qw x86_64 || { echo "::error::missing x86_64 slice"; exit 1; }
          echo "✓ universal (arm64 + x86_64)"

      # Suppress Windows Error Reporting dialogs so a crashing test subprocess
      # exits immediately instead of blocking on a modal "stopped working" prompt.
      - name: Suppress WER crash dialogs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Force -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" `
            -Name DontShowUI -Value 1 -PropertyType DWord | Out-Null

      # qt_ui_test links the Qt Advanced Docking System as a shared library
      # (LGPL compliance — cannot be static). The DLL is built by FetchContent
      # into build/release/_deps/qtads-build/ and is not on the system PATH,
      # so Windows' DLL loader hangs on a missing-library dialog instead of
      # exiting, causing the test to hit its 120 s timeout. Add the directory
      # containing the Release DLL to PATH so the loader finds it.
      - name: Add QADS DLL to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # qt_standard_project_setup() sets CMAKE_RUNTIME_OUTPUT_DIRECTORY to
          # the build root, so the QADS DLL lands in build\release\ directly
          # rather than build\release\_deps\qtads-build\. Search the whole
          # build tree so this step works regardless of where CMake places it.
          $dll = Get-ChildItem -Recurse -Path build\release `
                   -Filter "qtadvanceddocking*.dll" |
                 Where-Object {
                   $_.Name -notmatch 'd\.dll$' -and
                   $_.FullName -notmatch '\\CMakeFiles\\'
                 } |
                 Sort-Object FullName |
                 Select-Object -First 1
          if (-not $dll) {
            Write-Error "QADS DLL not found anywhere under build\release"
            Get-ChildItem -Recurse -Path build\release -File |
              Select-Object -First 100 FullName
            exit 1
          }
          Write-Host "QADS DLL: $($dll.FullName)"
          Add-Content $env:GITHUB_PATH $dll.DirectoryName

      - name: Test
        timeout-minutes: 10
        run: ctest --test-dir build/release --output-on-failure

      # ── Code signing (Windows) ──────────────────────────────────────────────
      # Defender's ASR rule "block executables unless they meet prevalence/age/
      # trusted-list criteria" rejects freshly built, unsigned binaries with
      # "Access is denied" — and it checks the *installed* clearCore-gui.exe, not
      # just the installer. So the app executables must be signed HERE, before
      # cpack copies them into the NSIS package; the installer itself is signed
      # in a second pass after packaging. Gated on AZURE_SIGNING_ACCOUNT so the
      # build still succeeds (shipping unsigned) until Trusted Signing is set up.
      - name: Azure login (OIDC) for signing
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: step-security/azure-login@a1dfaa9022efed17e561bea50a4342f790a38351 # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application binaries (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          # All three app targets are declared at the top level, so Ninja emits
          # them into the build root. Qt's own DLLs are already signed upstream.
          files: |
            ${{ github.workspace }}\build\release\clearCore-gui.exe
            ${{ github.workspace }}\build\release\clearCore-quick.exe
            ${{ github.workspace }}\build\release\number_system_converter.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Package (bundles Qt via windeployqt/macdeployqt at install time) ─────
      # Versioned, arch-labelled filenames; version comes from the release tag
      # (published release) or a dev placeholder (push / manual dispatch).
      - name: Package installer
        id: package
        shell: bash
        working-directory: build/release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_EVENT_RELEASE_TAG_NAME}"; version="${version#v}"
          else
            version="0.0.0-dev"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator="NSIS";      name="clearCore-${version}-windows-x64"
          else
            generator="DragNDrop"; name="clearCore-${version}-macOS-universal"
          fi
          cpack -G "$generator" \
                -D CPACK_PACKAGE_VERSION="$version" \
                -D CPACK_PACKAGE_FILE_NAME="$name" -V
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name".* || true
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      # Sign the NSIS installer itself so SmartScreen trusts the download and
      # doesn't show an "unknown publisher" wall. Reuses the OIDC login above.
      - name: Sign installer (Windows)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\release\${{ steps.package.outputs.name }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Install → uninstall round trip on the finished installer, so a broken
      # uninstaller fails here instead of on a user's machine. Runs before upload,
      # so a failure also keeps the installer off the release.
      - name: Test install / uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:GITHUB_WORKSPACE "build\release\$env:PACKAGE_NAME.exe"
          $instDir   = Join-Path $env:ProgramFiles 'clearCore'
          $menuDir   = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\clearCore'
          # NSIS installers are 32-bit and CPack's NSIS template never calls
          # `SetRegView 64`, so the Add/Remove Programs entry lands in the
          # WOW6432Node view, which 64-bit pwsh does not see under the plain
          # HKLM path. Checking only that path failed the v0.3.6 release build
          # and kept its Windows installer off the release. Add/Remove Programs
          # reads every view below, so the test does too.
          $uninstKeys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          )

          function Get-ClearCoreEntries {
            Get-ChildItem $uninstKeys -ErrorAction SilentlyContinue |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'clearCore*' }
          }

          function Install-ClearCore {
            $p = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          }

          # ── Install ───────────────────────────────────────────────────────────
          Install-ClearCore
          foreach ($exe in 'clearCore-gui.exe', 'clearCore-quick.exe', 'number_system_converter.exe') {
            if (-not (Get-ChildItem $instDir -Recurse -Filter $exe -ErrorAction SilentlyContinue)) {
              throw "$exe missing from $instDir after install"
            }
          }
          if (-not (Test-Path (Join-Path $instDir 'Uninstall.exe'))) { throw 'Uninstall.exe was not installed' }
          if (-not (Test-Path $menuDir))            { throw 'Start Menu shortcuts were not created' }
          if (-not (Get-ClearCoreEntries)) {
            Get-ChildItem $uninstKeys -ErrorAction SilentlyContinue |
              ForEach-Object { '{0} = {1}' -f $_.Name, (Get-ItemProperty $_.PSPath).DisplayName } |
              Write-Host
            throw 'no Add/Remove Programs entry was registered'
          }

          # ── Upgrade path: installing over an existing install must succeed ────
          # (CPACK_NSIS_ENABLE_UNINSTALL_BEFORE_INSTALL runs the old uninstaller first.)
          Install-ClearCore
          if (@(Get-ClearCoreEntries).Count -ne 1) { throw 'reinstall left duplicate Add/Remove Programs entries' }

          # ── Uninstall ─────────────────────────────────────────────────────────
          # NSIS uninstallers copy themselves to %TEMP% and return immediately, which
          # makes "did it finish?" a race. `_?=<dir>` keeps it in place and synchronous;
          # the price is that it can't delete itself or $INSTDIR, so we do that below.
          $p = Start-Process (Join-Path $instDir 'Uninstall.exe') `
                 -ArgumentList '/S', "_?=$instDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }

          $left = Get-ChildItem $instDir -Recurse -Force -ErrorAction SilentlyContinue |
                    Where-Object { -not $_.PSIsContainer -and $_.Name -ne 'Uninstall.exe' }
          if ($left) {
            $left | Select-Object -First 50 FullName | Format-Table | Out-String | Write-Host
            throw "uninstall left $(@($left).Count) file(s) behind in $instDir"
          }
          if (Test-Path $menuDir)          { throw 'Start Menu shortcuts left behind' }
          if (Get-ClearCoreEntries)        { throw 'Add/Remove Programs entry left behind' }

          Remove-Item $instDir -Recurse -Force   # the uninstaller's own leftover
          Write-Host 'Install / upgrade / uninstall round trip OK'

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearCore-${{ matrix.name }}
          path: |
            build/release/*.exe
            build/release/*.dmg
          if-no-files-found: error

      - name: Attach installer to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          STEPS_PACKAGE_OUTPUTS_NAME: ${{ steps.package.outputs.name }}
        run: |
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            "build/release/${STEPS_PACKAGE_OUTPUTS_NAME}".* \
            --clobber --repo "${{ github.repository }}"
