# ClusterFuzzLite corpus pruning.
#
# cflite_batch.yml accumulates redundant testcases in the corpus over time
# (inputs that don't add new coverage). Mandatory companion to batch fuzzing
# per ClusterFuzzLite's own guidance: prune daily to keep the corpus lean and
# fuzzing efficient. Runs against the same `cifuzz-corpus` branch batch
# fuzzing writes to.
name: ClusterFuzzLite corpus pruning

on:
  schedule:
    # Off the top of the hour (see cflite_batch.yml). If batch fuzzing is still
    # running, the shared concurrency group below makes this wait for it.
    - cron: '37 4 * * *'  # nightly, 04:37 UTC
  workflow_dispatch: { }

permissions:
  contents: read

# One group shared by cflite_batch.yml and cflite_prune.yml (deliberately not
# keyed on github.workflow): both rewrite the cifuzz-corpus branch, and prune
# replaces it wholesale, so they must never overlap. GitHub keeps one pending
# run per group, so a manual batch dispatch while batch is running replaces a
# waiting prune; that night's prune then shows as cancelled.
concurrency:
  group: cflite-corpus
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push the pruned corpus back to cifuzz-corpus
      security-events: write # SARIF upload to code scanning
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'prune'
          output-sarif: true
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          storage-repo-branch: cifuzz-corpus

      - name: Upload crash SARIF
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
