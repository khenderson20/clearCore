# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
# Path filter = the manifests GitHub's dependency graph can actually parse.
# In this repo that is only the workflow files (their `uses:` lines). CMake
# FetchContent is not a supported ecosystem, so the previous CMakeLists.txt
# filter ran the job exactly when it had nothing to review, and skipped it
# for the action bumps it can check.
on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

# A new push to a PR cancels that PR's previous run. Push and scheduled runs
# get a group of their own (run_id), so none is ever queued behind or
# cancelled by another: every commit on main/develop keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
