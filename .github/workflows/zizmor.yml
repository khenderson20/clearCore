# Static analysis for the workflows themselves — script injection, credential
# leakage, and over-broad permissions across the 8+ files in this directory.
# Complements Scorecard (repo-level supply-chain posture) and CodeQL (C++
# source) with a check aimed specifically at GitHub Actions YAML.
#
# Advanced Security mode: findings surface in Security > Code scanning rather
# than failing the run directly (GitHub's own guidance for SARIF-producing
# tools — see the zizmor-action README). To make findings block a merge
# instead of just being visible, enable code-scanning merge protection on the
# `zizmor` tool in the repo's branch protection / ruleset settings.
name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions: {}

# A new push to a PR cancels that PR's previous run. Push and scheduled runs
# get a group of their own (run_id), so none is ever queued behind or
# cancelled by another: every commit on main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: step-security/zizmor-action@0d7097f162a7f6dd65730d10bbcd17f070cf87e2 # v0.6.4
