# ClusterFuzzLite fuzzing coverage reports.
#
# Builds an HTML coverage report from the corpus cflite_batch.yml has
# accumulated on the `cifuzz-corpus` branch, showing which parts of the MIPS
# decoder/parser fuzzing actually reaches. Also feeds cflite_pr.yml's
# affected-fuzzers detection (which fuzzer(s) a given code change touches).
#
# Coverage mode ALWAYS pushes the report to the storage repo's coverage
# branch; there is no read-only variant. With a tokenless storage-repo URL
# the push failed every night ("could not read Username"), so neither the
# report nor the affected-fuzzers data ever landed. It now pushes to its own
# `cifuzz-coverage` branch (not the action's default `gh-pages`, since this
# repo serves no Pages site), and the report is also uploaded as an artifact:
# open the run summary -> Artifacts -> coverage-report.
name: ClusterFuzzLite coverage report

on:
  schedule:
    # Off the top of the hour: GitHub delays (and under load drops) scheduled
    # runs queued at :00. Runs after cflite_prune.yml.
    - cron: '17 5 * * *'  # nightly, 05:17 UTC
  workflow_dispatch: { }

permissions:
  contents: read

# Every run pushes to cifuzz-coverage, so a manual dispatch overlapping the
# nightly run waits for it instead of racing it for the push.
concurrency:
  group: cflite-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # push the report to the cifuzz-coverage branch
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: coverage

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'coverage'
          sanitizer: 'coverage'
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          storage-repo-branch: cifuzz-corpus
          storage-repo-branch-coverage: cifuzz-coverage

      - name: Upload coverage report
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: out/report/linux
          if-no-files-found: warn
