name: Release Drafter

on:
  push:
    branches:
      - main
  # NOTE: release-drafter needs write permissions; running on fork PRs will fail due to read-only tokens.
  # The push-to-main trigger below updates the draft release after merge, so a PR trigger is unnecessary.

permissions:
  contents: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: step-security/release-drafter@641fda6024a7b071f83dbe2f854eec5d862336b9 # v7.10.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
