name: Release Drafter

on:
  push:
    branches:
      - main
  # NOTE: release-drafter needs write permissions; running on fork PRs will fail due to read-only tokens.
  # The push-to-main trigger below updates the draft release after merge, so a PR trigger is unnecessary.

permissions:
  contents: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: step-security/release-drafter@a51d1a7992b1288f25572b6d6a24ec5df724cf01 # v7.7.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
